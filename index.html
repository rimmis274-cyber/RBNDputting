<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tote Logger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f1f3f6;color:#212121}
header{background:#2874f0;color:#fff;padding:14px 16px;font-size:20px;font-weight:600;position:sticky;top:0;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.2)}
header i{color:#ffe500;font-size:13px;font-weight:400;margin-left:6px}
header small{float:right;font-size:11px;font-weight:400;opacity:.85;margin-top:6px}
main{max-width:480px;margin:auto;padding:12px}
#banner{display:none;background:#fdecea;color:#b71c1c;border-left:4px solid #d32f2f;border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:13px;word-break:break-word}
#dbg{background:#fff8e1;border-left:4px solid #ffc107;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:13px;word-break:break-all}
<div id="dbg">Last scan: —</div>
<div class="steps">
  <div class="st" id="st1"><div class="n">1</div>Tote</div>
  <div class="st" id="st2"><div class="n">2</div>Location</div>
  <div class="st" id="st3"><div class="n">3</div>WIDs</div>
</div>

<div id="vSetup">
  <div class="card" id="c1">
    <div class="ct">Step 1 · Scan tote</div>
    <div class="cs">Scan the tote ID label</div>
    <input id="toteIn" placeholder="Tote ID" autocomplete="off">
    <div id="toteLock" class="locked" style="display:none"></div>
  </div>
  <div class="card" id="c2">
    <div class="ct">Step 2 · Scan location</div>
    <div class="cs">Scan the bin / shelf label where this tote is placed</div>
    <input id="locIn" placeholder="Location ID" autocomplete="off">
  </div>
  <button class="pri" onclick="commit()" style="margin-bottom:12px">NEXT</button>
  <div class="card"><div class="ct">Recent · Pending <b id="pend">0</b></div><div id="hist"><div class="empty">No submissions yet</div></div></div>
</div>

<div id="vScan" style="display:none">
  <div class="sum">
    <div>Tote<b id="sTote"></b></div>
    <div>Location<b id="sLoc"></b></div>
  </div>
  <div class="card act">
    <div class="ct">Step 3 · Scan WIDs <span id="cnt" style="float:right;text-transform:none">0 scanned</span></div>
    <div class="cs">Keep scanning WIDs one after another</div>
    <input id="wid" placeholder="WID" autocomplete="off">
    <button class="sec" onclick="addWid()">ADD</button>
    <div id="list" style="margin-top:8px"></div>
    <div class="seg">
      <button id="bSame" class="on" onclick="setMode('same')">SAME TOTE<br>NEW LOCATION</button>
      <button id="bDet" class="d" onclick="setMode('detach')">DETACH<br>TOTE</button>
    </div>
    <button class="pri" onclick="submitB()" style="margin-top:12px">SUBMIT</button>
    <button class="sec" onclick="cancelB()">CANCEL</button>
  </div>
</div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbykdNT3mWYI1-AvczL6mlkTFCUXQR6wEgmyK7-ml6itAOo0dJ06AHysfqLV08qAZR3vTA/exec';
const GAS=(typeof google!=='undefined')&&google.script&&google.script.run;

const $=id=>document.getElementById(id);
let tote=null,loc=null,items=[],mode='same',q=[],busy=false,stage='tote';

function banner(m){const b=$('banner');b.style.display=m?'block':'none';b.textContent=m||'';}
function dbg(m){$('dbg').textContent='Last scan: '+m;}
const HINT='Backend returned a web page, not data. In Apps Script: Deploy → Manage deployments → pencil → New version, access = Anyone.';
function parse(t){try{return JSON.parse(t);}catch(e){throw new Error(HINT);}}

function ping(){
  if(GAS){google.script.run.withSuccessHandler(v=>{$('ver').textContent=v;banner('');})
    .withFailureHandler(e=>banner('Setup error: '+(e.message||e))).ping();return;}
  fetch(API+'?api=1').then(r=>r.text()).then(parse)
    .then(r=>{if(r.ok){$('ver').textContent=r.version;banner('');}else banner('Backend error: '+r.error);})
    .catch(e=>banner('Cannot reach backend: '+e.message));
}
function send(p){
  if(GAS)return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res)
    .withFailureHandler(e=>rej(new Error(e.message||e))).logBatch(p.tote,p.loc,p.items,p.detach);});
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
    .then(r=>r.text()).then(parse);
}

function stepper(n){
  for(let i=1;i<=3;i++){const e=$('st'+i);
    e.className='st'+(i<n?' done':i===n?' act':'');
    e.firstChild.textContent=i<n?'✓':i;}
  $('c1').className='card'+(n===1?' act':n>1?' ok':'');
  $('c2').className='card'+(n===2?' act':'');
}
function view(v){$('vSetup').style.display=v==='s'?'block':'none';$('vScan').style.display=v==='c'?'block':'none';}
function target(){return stage==='tote'?$('toteIn'):stage==='loc'?$('locIn'):$('wid');}
function focusT(){setTimeout(()=>{const t=target();t.focus();},60);}

function showSetup(){
  view('s');
  $('toteIn').style.display=tote?'none':'block';
  $('toteLock').style.display=tote?'block':'none';
  $('toteLock').textContent=tote?'✓ '+tote+' (same tote)':'';
  $('toteIn').value='';$('locIn').value='';
  stage=tote?'loc':'tote';
  stepper(tote?2:1);focusT();
}

function commit(){                                   // one scan finished → route by stage
  clearTimeout(idle);burst=false;last=0;
  if(stage==='tote'){
    const v=$('toteIn').value.trim();if(!v)return;
    dbg('Tote → '+v);stage='loc';stepper(2);focusT();
  }else if(stage==='loc'){
    const t=tote||$('toteIn').value.trim(),l=$('locIn').value.trim();
    if(!t){stage='tote';stepper(1);focusT();return;}
    if(!l)return;
    dbg('Location → '+l);
    tote=t;loc=l;items=[];
    $('sTote').textContent=tote;$('sLoc').textContent=loc;
    render();view('c');stage='wid';stepper(3);focusT();
  }else addWid();
}

function addWid(){
  const w=$('wid').value.trim();if(!w){focusT();return;}
  const it=items.find(x=>x.w===w);
  if(it){it.q++;items=[it].concat(items.filter(x=>x!==it));dbg('WID → '+w+' (qty '+it.q+')');}
  else{items.unshift({w:w,q:1});dbg('WID → '+w);}
  $('wid').value='';render();focusT();
}
function rm(w){items=items.filter(x=>x.w!==w);render();focusT();}
function render(){
  const L=$('list');L.innerHTML='';
  if(!items.length)L.innerHTML='<div class="empty">No WIDs scanned yet</div>';
  items.forEach(it=>{
    const d=document.createElement('div');d.className='item';
    const a=document.createElement('div');a.textContent=it.w;
    const m=document.createElement('div');
    const s=document.createElement('span');s.textContent='×'+it.q;
    const x=document.createElement('a');x.textContent='×';x.onclick=()=>rm(it.w);
    m.append(s,x);d.append(a,m);L.append(d);
  });
  $('cnt').textContent=items.reduce((a,b)=>a+b.q,0)+' scanned';
}
function setMode(m){mode=m;
  $('bSame').classList.toggle('on',m==='same');
  $('bDet').classList.toggle('on',m==='detach');focusT();}
function cancelB(){items=[];tote=null;loc=null;mode='same';setMode('same');showSetup();}
function submitB(){
  if($('wid').value.trim())addWid();
  if(!items.length){banner('Scan at least one WID');focusT();return;}
  banner('');
  const detach=mode==='detach',total=items.reduce((a,b)=>a+b.q,0);
  const row=document.createElement('div');row.className='h';
  row.textContent='… '+tote+' @ '+loc+' · '+total+' WIDs';
  const H=$('hist');if(H.querySelector('.empty'))H.innerHTML='';H.prepend(row);
  q.push({t:tote,l:loc,items:items,d:detach,row:row,total:total,tries:0});
  items=[];if(detach)tote=null;
  mode='same';$('bSame').classList.add('on');$('bDet').classList.remove('on');
  loc=null;showSetup();upd();run();
}
function upd(){$('pend').textContent=q.length;}
function fail(b,msg){
  busy=false;b.tries++;b.row.className='h err';
  if(b.tries<3){b.row.textContent='✗ '+msg+' · retrying '+b.tries+'/3';setTimeout(run,2000);}
  else{b.row.textContent='✗ '+msg+' · TAP TO RETRY';b.row.style.cursor='pointer';
    b.row.onclick=()=>{b.tries=0;b.row.onclick=null;b.row.style.cursor='';run();};}
}
function run(){
  if(busy||!q.length)return;busy=true;const b=q[0];
  send({tote:b.t,loc:b.l,items:b.items,detach:b.d})
    .then(r=>{
      if(r&&r.ok){q.shift();busy=false;b.row.className='h';
        b.row.textContent='✓ '+b.t+' @ '+b.l+' · '+b.total+' WIDs'+(b.d?' · detached':'');upd();run();}
      else fail(b,(r&&r.error)||'Bad response');})
    .catch(e=>fail(b,e.message||String(e)));
}

/* ---- page-wide scanner capture: works with Enter, Tab, or no suffix, even if focus is lost ---- */
let last=0,burst=false,idle;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,kc=e.keyCode;
  if(k==='Enter'||k==='Tab'||kc===13||kc===9){e.preventDefault();commit();return;}
  if(k&&k.length===1){
    const t=target();
    if(document.activeElement!==t){e.preventDefault();t.focus();t.value+=k;}
    const n=Date.now();if(last&&n-last<50)burst=true;last=n;
    clearTimeout(idle);
    idle=setTimeout(()=>{if(burst&&target().value.trim().length>=3)commit();burst=false;last=0;},150);
  }
},true);

window.onbeforeunload=()=>q.length?'Pending':undefined;
showSetup();ping();
</script></body></html>
